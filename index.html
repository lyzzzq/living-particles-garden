<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>浮游花园 · Living Particles</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@1.3.1/dist/ml5.min.js"></script>
</head>
<body><main>
  <section class="garden-card" aria-label="手势绘画花园"><div id="canvas-container"></div></section>
  <header><div class="eyebrow">A STUDY OF LIGHT & GROWTH</div><h1>浮游花园<span>LIVING PARTICLES</span></h1><p>停留一秒，种下你的第一朵花。</p></header>
  <div class="toolbar"><span>BOTANICAL STUDY</span><span id="count">你种下了 0 朵花</span></div>
  <div id="tracking-speed" aria-live="off"></div>
  <nav aria-label="绘画工具">
    <button id="camera">开启手势</button><button id="mouse" aria-pressed="true">鼠标练习</button>
    <button id="save">收藏画作</button><button id="clear">重新开始</button>
  </nav>
  <div class="sound-controls" role="group" aria-label="花园声音"><button id="sound" aria-pressed="false" aria-describedby="sound-state">开启声音</button><label for="volume">音量</label><input id="volume" type="range" min="0" max="100" value="30" aria-label="声音音量"><output id="volume-value" for="volume">30%</output><span id="sound-state" role="status">轻风与铃音 · 点击开启</span></div>
  <div class="status"><span id="status" role="status" aria-live="polite">停留 1 秒种花，大小随机 · 移动引藤 · 张掌绽放 · 握拳闭合　 /　 鼠标、空格、F 键可练习</span></div>
</main><script src="sketch.js"></script></body>
</html>
